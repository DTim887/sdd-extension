installed:
- de-speckit-extension
- git
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  - extension: de-speckit-extension
    command: speckit.de-speckit-extension.read-jira-ticket
    enabled: true
    optional: true
    priority: 10
    prompt: 读取 JIRA 门禁检查 constitution 生成前
    description: JIRA 门禁：读取 ticket 并交给下一步
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.feature?
